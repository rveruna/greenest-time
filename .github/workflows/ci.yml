name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Informational, not a gate: the open advisories are all in Expo's build tooling (Metro, CLI, config
      # plugins), none is critical, and none of that code ships in the web bundle. Fixing them needs an
      # Expo SDK upgrade, not `npm audit fix --force`.
      - run: npm audit --omit=dev --audit-level=high
        continue-on-error: true
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run format:check
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Accessibility audit (axe in a real browser, 15 screen states, fake API data)
        run: npm run a11y-audit
